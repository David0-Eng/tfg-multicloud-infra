name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [aws-dev, aws-ha, azure-dev]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend, no credentials needed)
        run: terraform -chdir=envs/${{ matrix.env }} init -backend=false

      - name: Validate
        run: terraform -chdir=envs/${{ matrix.env }} validate

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Static security analysis of the IaC. soft_fail: findings are
      # reported without blocking the push; accepted ones are justified
      # in the thesis.
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
